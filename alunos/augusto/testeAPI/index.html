<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Adicionar Filme - API Movies</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    label { font-weight: bold; }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    button {
      background: #007bff;
      color: #fff;
      cursor: pointer;
      border: none;
      margin-top: 20px;
    }
    button:hover { background: #0056b3; }
    pre {
      background: white;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>Adicionar Filme (POST /movies)</h1>

<label>ID:</label>
<input id="id" type="number" placeholder="Ex: 1">

<label>Título:</label>
<input id="title" type="text" placeholder="Ex: Matrix">

<label>Diretor:</label>
<input id="director" type="text" placeholder="Ex: Wachowski">

<label>Ano:</label>
<input id="year" type="number" placeholder="Ex: 1999">

<label>Gênero:</label>
<input id="genre" type="text" placeholder="Ex: Sci-Fi">

<button onclick="enviarFilme()">Enviar Filme</button>

<h2>Resposta da API:</h2>
<pre id="resposta">{}</pre>

<script>
async function enviarFilme() {
  const url = "http://85.209.93.21:8885/movies";

  const filme = {
    id: Number(document.getElementById("id").value),
    title: document.getElementById("title").value,
    director: document.getElementById("director").value,
    year: Number(document.getElementById("year").value),
    genre: document.getElementById("genre").value
  };

  try {
    const resposta = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "accept": "*/*"
      },
      body: JSON.stringify(filme)
    });

    const texto = await resposta.text();
    try {
      document.getElementById("resposta").textContent =
        JSON.stringify(JSON.parse(texto), null, 2);
    } catch {
      document.getElementById("resposta").textContent = texto;
    }

  } catch (erro) {
    document.getElementById("resposta").textContent = "Erro: " + erro;
  }
}
</script>

</body>
</html>
