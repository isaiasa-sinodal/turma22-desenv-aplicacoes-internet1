<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Movies API Interface</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    button {
      padding: 10px 20px;
      margin-right: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-get { background: #28a745; color: white; }
    .btn-post { background: #007bff; color: white; }

    pre {
      background: white;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      border: 1px solid #ccc;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      width: 350px;
      border-radius: 8px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .close {
      float: right;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>Movies API Interface</h1>

<button class="btn-get" onclick="fazerGet()">GET Filmes</button>
<button class="btn-post" onclick="abrirModal()">POST Filme</button>

<pre id="saida">{}</pre>

<!-- Modal para POST -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="fecharModal()">X</span>
    <h3>Adicionar Filme</h3>

    <label>ID</label>
    <input id="id" type="number">

    <label>Título</label>
    <input id="title" type="text">

    <label>Diretor</label>
    <input id="director" type="text">

    <label>Ano</label>
    <input id="year" type="number">

    <label>Gênero</label>
    <input id="genre" type="text">

    <button class="btn-post" style="margin-top: 15px;" onclick="fazerPost()">Enviar</button>
  </div>
</div>

<script>
function abrirModal() {
  document.getElementById("modal").style.display = "flex";
}

function fecharModal() {
  document.getElementById("modal").style.display = "none";
}

async function fazerGet() {
  const url = "http://85.209.93.21:8885/movies";

  try {
    const resposta = await fetch(url);
    const dados = await resposta.json();

    document.getElementById("saida").textContent =
      JSON.stringify(dados, null, 2);

  } catch (erro) {
    document.getElementById("saida").textContent = "Erro: " + erro;
  }
}

async function fazerPost() {
  const url = "http://85.209.93.21:8885/movies";

  const filme = {
    id: Number(document.getElementById("id").value),
    title: document.getElementById("title").value,
    director: document.getElementById("director").value,
    year: Number(document.getElementById("year").value),
    genre: document.getElementById("genre").value
  };

  try {
    const resposta = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "accept": "*/*"
      },
      body: JSON.stringify(filme)
    });

    const dados = await resposta.json();

    document.getElementById("saida").textContent =
      JSON.stringify(dados, null, 2);

  } catch (erro) {
    document.getElementById("saida").textContent = "Erro: " + erro;
  }

  fecharModal();
}
</script>

</body>
</html>
