<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Movies API Interface</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    button {
      padding: 10px 20px;
      margin-right: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-get { background: #28a745; color: white; }
    .btn-post { background: #007bff; color: white; }
    .btn-delete { background: #dc3545; color: white; }
    .btn-edit { background: #ffc107; color: black; }

    .filme {
      background: white;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      width: 350px;
      border-radius: 8px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .close {
      float: right;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>Movies API Interface</h1>

<button class="btn-get" onclick="fazerGet()">GET Filmes</button>
<button class="btn-post" onclick="abrirModalPost()">POST Filme</button>

<div id="saida"></div>

<!-- Modal POST -->
<div class="modal" id="modalPost">
  <div class="modal-content">
    <span class="close" onclick="fecharModalPost()">X</span>
    <h3>Adicionar Filme</h3>

    <label>ID</label>
    <input id="post-id" type="number">

    <label>Título</label>
    <input id="post-title" type="text">

    <label>Diretor</label>
    <input id="post-director" type="text">

    <label>Ano</label>
    <input id="post-year" type="number">

    <label>Gênero</label>
    <input id="post-genre" type="text">

    <button class="btn-post" style="margin-top: 15px;" onclick="fazerPost()">Enviar</button>
  </div>
</div>

<!-- Modal EDIT -->
<div class="modal" id="modalEdit">
  <div class="modal-content">
    <span class="close" onclick="fecharModalEdit()">X</span>
    <h3>Editar Filme</h3>

    <input id="edit-id" type="hidden">

    <label>Título</label>
    <input id="edit-title" type="text">

    <label>Diretor</label>
    <input id="edit-director" type="text">

    <label>Ano</label>
    <input id="edit-year" type="number">

    <label>Gênero</label>
    <input id="edit-genre" type="text">

    <button class="btn-edit" style="margin-top: 15px;" onclick="fazerPut()">Salvar Alterações</button>
  </div>
</div>

<script>
const API = "http://85.209.93.21:8885/movies";

/* -------- MODAL POST -------- */
function abrirModalPost() {
  document.getElementById("modalPost").style.display = "flex";
}

function fecharModalPost() {
  document.getElementById("modalPost").style.display = "none";
}

/* -------- MODAL EDIT -------- */
function abrirModalEdit(filme) {
  document.getElementById("edit-id").value = filme.id;
  document.getElementById("edit-title").value = filme.title;
  document.getElementById("edit-director").value = filme.director;
  document.getElementById("edit-year").value = filme.year;
  document.getElementById("edit-genre").value = filme.genre;

  document.getElementById("modalEdit").style.display = "flex";
}

function fecharModalEdit() {
  document.getElementById("modalEdit").style.display = "none";
}

/* -------- GET FILMES -------- */
async function fazerGet() {
  const saida = document.getElementById("saida");

  try {
    const resposta = await fetch(API);
    const filmes = await resposta.json();

    saida.innerHTML = ""; // limpa tela

    filmes.forEach(filme => {
      const div = document.createElement("div");
      div.className = "filme";

      div.innerHTML = `
        <strong>ID:</strong> ${filme.id}<br>
        <strong>Título:</strong> ${filme.title}<br>
        <strong>Diretor:</strong> ${filme.director}<br>
        <strong>Ano:</strong> ${filme.year}<br>
        <strong>Gênero:</strong> ${filme.genre}<br><br>
        <button class="btn-edit" onclick='abrirModalEdit(${JSON.stringify(filme)})'>Editar</button>
        <button class="btn-delete" onclick="deletarFilme(${filme.id})">Excluir</button>
      `;

      saida.appendChild(div);
    });

  } catch (erro) {
    saida.innerHTML = "Erro: " + erro;
  }
}

/* -------- POST FILME -------- */
async function fazerPost() {
  const filme = {
    id: Number(document.getElementById("post-id").value),
    title: document.getElementById("post-title").value,
    director: document.getElementById("post-director").value,
    year: Number(document.getElementById("post-year").value),
    genre: document.getElementById("post-genre").value
  };

  try {
    await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "accept": "*/*"
      },
      body: JSON.stringify(filme)
    });

    fecharModalPost();
    fazerGet();

  } catch (erro) {
    alert("Erro ao enviar: " + erro);
  }
}

/* -------- PUT FILME (EDITAR) -------- */
async function fazerPut() {
  const id = document.getElementById("edit-id").value;

  const filmeAtualizado = {
    id: Number(id),
    title: document.getElementById("edit-title").value,
    director: document.getElementById("edit-director").value,
    year: Number(document.getElementById("edit-year").value),
    genre: document.getElementById("edit-genre").value
  };

  try {
    await fetch(`${API}/${id}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "accept": "*/*"
      },
      body: JSON.stringify(filmeAtualizado)
    });

    fecharModalEdit();
    fazerGet();

  } catch (erro) {
    alert("Erro ao editar: " + erro);
  }
}

/* -------- DELETE FILME -------- */
async function deletarFilme(id) {
  if (!confirm("Deseja excluir o filme ID " + id + "?")) return;

  try {
    await fetch(`${API}/${id}`, {
      method: "DELETE",
      headers: { "accept": "*/*" }
    });

    fazerGet();

  } catch (erro) {
    alert("Erro ao excluir: " + erro);
  }
}
</script>

</body>
</html>
